name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CJK fonts (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab pdfplumber pypdf pillow jsonschema
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify cited sources
        run: python scripts/check_sources.py --spec examples/spec-example.json --allow-blocked
      - name: End-to-end smoke test
        run: python tests/smoke_test.py
